<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Apartment Explorer</title>
<style>
  :root {
    --ink: #1d1f23; --muted: #6b7078; --line: rgba(20, 24, 30, 0.1); --panel: rgba(255, 255, 255, 0.86);
    --accent: #1f6fe0; --shadow: 0 6px 24px rgba(20, 30, 45, 0.14);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; font: 13px/1.4 -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif; color: var(--ink); background: #e9ecef; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  body[data-mode='walk'] #c { cursor: grab; }
  body[data-mode='walk'] #c:active { cursor: grabbing; }
  .labels { position: fixed; inset: 0; pointer-events: none; }
  .panel { position: fixed; background: var(--panel); backdrop-filter: blur(14px) saturate(1.4); -webkit-backdrop-filter: blur(14px) saturate(1.4); border-radius: 14px; box-shadow: var(--shadow); border: 1px solid rgba(255,255,255,0.6); }

  /* top bar */
  #top { top: 14px; left: 14px; right: 14px; display: flex; gap: 10px; align-items: stretch; background: none; box-shadow: none; border: 0; backdrop-filter: none; -webkit-backdrop-filter: none; pointer-events: none; }
  #top > * { pointer-events: auto; }
  #tabs { display: flex; gap: 6px; padding: 5px; background: var(--panel); border-radius: 14px; box-shadow: var(--shadow); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); overflow-x: auto; }
  .tab { border: 0; background: transparent; padding: 7px 12px; border-radius: 10px; text-align: left; cursor: pointer; color: var(--ink); white-space: nowrap; }
  .tab b { display: block; font-size: 13px; font-weight: 600; }
  .tab span { display: block; font-size: 11px; color: var(--muted); }
  .tab:hover { background: rgba(0,0,0,0.05); }
  .tab.on { background: var(--ink); color: #fff; }
  .tab.on span { color: rgba(255,255,255,0.7); }
  .tab.pending { opacity: 0.45; cursor: default; }
  .tab.pending b { font-weight: 500; }
  #modes { display: flex; gap: 4px; padding: 5px; background: var(--panel); border-radius: 14px; box-shadow: var(--shadow); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); margin-left: auto; }
  #modes button, .btn { border: 0; background: transparent; padding: 8px 12px; border-radius: 10px; font-size: 13px; font-weight: 500; cursor: pointer; color: var(--ink); }
  #modes button:hover, .btn:hover { background: rgba(0,0,0,0.05); }
  #modes button.on, .btn.on { background: var(--accent); color: #fff; }
  #modes kbd { font: 10px ui-monospace, monospace; opacity: 0.55; margin-left: 4px; }

  /* side info panel */
  #side { top: 86px; right: 14px; width: 320px; max-height: calc(100% - 100px); overflow: auto; padding: 16px 16px 12px; }
  body.noinfo #side { display: none; }
  #side h1 { font-size: 19px; margin: 0; letter-spacing: -0.01em; }
  #side .sub { color: var(--muted); margin: 2px 0 10px; }
  #side h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 16px 0 6px; font-weight: 600; }
  #side h2 small { text-transform: none; letter-spacing: 0; font-weight: 400; }
  table.facts { width: 100%; border-collapse: collapse; }
  table.facts td { padding: 3px 0; border-bottom: 1px solid var(--line); }
  table.facts td:first-child { color: var(--muted); width: 42%; }
  ul.rooms { list-style: none; padding: 0; margin: 0; }
  ul.rooms li { display: grid; grid-template-columns: 1fr auto 58px; gap: 8px; padding: 5px 6px; margin: 0 -6px; border-radius: 7px; cursor: pointer; }
  ul.rooms li:hover { background: rgba(31,111,224,0.08); }
  ul.rooms li span:nth-child(2) { color: var(--muted); font-size: 12px; }
  ul.rooms li span:nth-child(3) { text-align: right; font-variant-numeric: tabular-nums; }
  ul.spec { padding-left: 16px; margin: 0; color: #3a3e45; }
  iframe.map { width: 100%; height: 210px; border: 0; border-radius: 10px; display: block; background: #e6e8ea; }
  .maplinks { margin-top: 5px; font-size: 12px; }
  .maplinks a { color: var(--accent); text-decoration: none; }
  .maplinks a:hover { text-decoration: underline; }
  .osmnote { margin-top: 3px; font-size: 11px; color: var(--muted); }
  ul.spec li { margin: 2px 0; }
  .ctl { margin-top: 4px; }
  .row { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
  .row label { color: var(--muted); min-width: 74px; }
  .row input[type=range] { flex: 1; accent-color: var(--accent); }
  .row .val { min-width: 54px; text-align: right; font-variant-numeric: tabular-nums; }
  .row select { flex: 1; padding: 4px; border-radius: 7px; border: 1px solid var(--line); background: #fff; }
  .checks { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px; margin-top: 6px; }
  .checks label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
  #sunval { color: var(--muted); font-size: 12px; }
  #measureval { color: #d0302a; font-weight: 600; margin-left: 8px; }

  /* walk HUD */
  #roomhud { left: 14px; bottom: 14px; padding: 10px 14px; min-width: 180px; }
  #roomhud b { display: block; font-size: 15px; }
  #roomhud span { display: inline-block; color: var(--muted); margin-right: 10px; }
  #minimap { position: fixed; right: 348px; bottom: 76px; width: 220px; height: 220px; border-radius: 14px; background: rgba(255,255,255,0.7); box-shadow: var(--shadow); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  body.noinfo #minimap { right: 14px; }
  #walkhelp, #planhelp { left: 50%; transform: translateX(-50%); bottom: 14px; padding: 8px 14px; color: #3a3e45; font-size: 12px; text-align: center; }
  #walkhelp kbd, #planhelp kbd { font: 11px ui-monospace, monospace; background: rgba(0,0,0,0.07); border-radius: 4px; padding: 1px 5px; }
  #crosshair { position: fixed; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%; background: rgba(255,255,255,0.8); box-shadow: 0 0 0 1px rgba(0,0,0,0.25); pointer-events: none; display: none; }
  body[data-mode='walk'] #crosshair { display: block; }
  #northarrow { position: fixed; left: 24px; top: 92px; width: 46px; height: 46px; display: none; }
  body[data-mode='plan'] #northarrow, body[data-mode='compare'] #northarrow { display: block; }
  body[data-mode='compare'] #northarrow { display: none; }
  #infoToggle { position: fixed; right: 14px; top: 86px; z-index: 3; display: none; }
  body.noinfo #infoToggle { display: block; }

  /* labels */
  .roomlabel { text-align: center; color: #23262b; text-shadow: 0 0 3px #fff, 0 0 6px #fff, 0 0 10px #fff; white-space: nowrap; line-height: 1.25; }
  .roomlabel b { display: block; font-size: 13px; }
  .roomlabel .dims { display: block; font-size: 11px; color: #4a4f57; }
  .roomlabel .area { display: block; font-size: 11px; font-weight: 600; color: #1f6fe0; }
  .roomlabel.small b { font-size: 11px; font-weight: 600; }
  .roomlabel.outdoor b { color: #7a5a2f; }
  .apttitle { text-align: center; background: rgba(255,255,255,0.9); padding: 8px 14px; border-radius: 12px; box-shadow: var(--shadow); }
  .apttitle b { display: block; font-size: 16px; }
  .apttitle span { display: block; color: var(--muted); font-size: 12px; }
  .measure { background: #ff3b30; color: #fff; font-weight: 700; padding: 3px 8px; border-radius: 8px; font-size: 13px; }

  #loading { position: fixed; inset: 0; display: grid; place-items: center; background: #eef0f2; z-index: 10; font-size: 15px; color: var(--muted); transition: opacity 0.4s; }
  body.ready #loading { opacity: 0; pointer-events: none; }
  @media (max-width: 900px) { #side { display: none; } #minimap { right: 14px; width: 160px; height: 160px; } }
</style>
</head>
<body data-mode="walk">
<canvas id="c"></canvas>
<div id="loading">Building apartments…</div>
<div id="crosshair"></div>

<div id="top" class="panel">
  <div id="tabs"></div>
  <div id="modes">
    <button data-mode="walk">Walk <kbd>1</kbd></button>
    <button data-mode="dollhouse">Dollhouse <kbd>2</kbd></button>
    <button data-mode="plan">Plan <kbd>3</kbd></button>
    <button data-mode="compare">Compare <kbd>4</kbd></button>
  </div>
</div>

<div id="side" class="panel">
  <div id="info"></div>
  <h2>Sun &amp; light</h2>
  <div class="row"><label>Season</label><select id="season"></select></div>
  <div class="row"><label>Time</label><input id="time" type="range" min="5" max="21" step="0.25" /><span class="val" id="timeval"></span></div>
  <div id="sunval"></div>
  <h2>View</h2>
  <div class="row"><label>Eye height</label><input id="eye" type="range" min="1.1" max="2.0" step="0.01" /><span class="val" id="eyeval"></span></div>
  <div class="row"><label>Field of view</label><input id="fov" type="range" min="40" max="90" step="1" /><span class="val" id="fovval"></span></div>
  <div class="row" id="cutrow"><label>Wall cut</label><input id="cut" type="range" min="0.9" max="2.9" step="0.1" /><span class="val" id="cutval"></span></div>
  <div class="checks">
    <label><input type="checkbox" id="tFurniture" /> Furniture</label>
    <label><input type="checkbox" id="tPeople" /> 1.75 m person</label>
    <label><input type="checkbox" id="tCollide" checked /> Walls block</label>
    <label><input type="checkbox" id="tQuality" /> High quality</label>
    <label title="Show the developer's original drawing on top (plan view)"><input type="checkbox" id="tOverlay" /> Original plan</label>
  </div>
  <div class="row" style="margin-top:10px"><button class="btn" id="measureBtn">📏 Measure <kbd>M</kbd></button><span id="measureval"></span></div>
  <div class="row"><button class="btn" id="hidePanel">Hide panel</button></div>
</div>
<button class="btn panel" id="infoToggle">Show panel</button>

<div id="roomhud" class="panel"></div>
<canvas id="minimap" width="440" height="440"></canvas>
<div id="walkhelp" class="panel">Drag to look · <kbd>W A S D</kbd> / arrows to walk · <kbd>Shift</kbd> faster · click the floor to walk there · two-finger scroll to move · <kbd>L</kbd> mouse-lock · <kbd>Tab</kbd> next apartment</div>
<div id="planhelp" class="panel">Drag to pan · scroll / pinch to zoom · rooms show net size measured from the plans · <kbd>M</kbd> to measure</div>
<svg id="northarrow" viewBox="0 0 46 46"><circle cx="23" cy="23" r="21" fill="rgba(255,255,255,0.9)" stroke="#999"/><path d="M23 5 L29 25 L23 21 L17 25 Z" fill="#d0302a"/><path d="M23 41 L29 25 L23 29 L17 25 Z" fill="#888"/><text x="23" y="16" font-size="0" text-anchor="middle">N</text></svg>

<script src="dist/app.js"></script>
</body>
</html>
